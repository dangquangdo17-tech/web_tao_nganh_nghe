version: '3.8'

services:
  educompass-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educompass_ai_counselor
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount database to persist across container restarts
      - ./app/database:/app/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/api/universities"]
      interval: 30s
      timeout: 10s
      retries: 3
